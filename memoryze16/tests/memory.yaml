version: 1
architecture: cdm16
memory_model: unified
build:
  sources:
  - ../memory.mlb
  - ../stack.mlb
  - ../pointers.mlb
defaults:
  setup:
    registers:
      r0: 17
      r1: 34
      r2: 51
      r3: 68
      r4: 85
      r5: 102
      r6: 119
      r7: 136
      sp: 61440
    memory:
      0x8ffe: [0x53, 0x0]
      0x9010: [0xa7, 0x0]
  run:
    until: halt
    max_steps: 5000
  preserve_registers:
  - sp
  - r4
  - r5
  - r6
  - r7
  allowed_register_changes:
  - r0
  - r1
  - r2
  - r3
  preserve_memory:
  - address: 0x0
    length: 36864
  - address: 0x9010
    length: 28656
cases:
  ordinary:
    setup:
      memory:
        0x9000: [0x4, 0x0]
        0x9002: [0x9, 0x0]
        0x9004: [0x7, 0x0]
        0x9006: [0x1f, 0x0]
        0x9008: [0x8, 0x0]
        0x900a: [0x2, 0x0]
        0x900c: [0x13, 0x0]
        0x900e: [0x6, 0x0]
    expect:
      memory:
        0x9000: [0x5, 0x0]
        0x9002: [0x8, 0x0]
        0x9004: [0x2a, 0x0]
        0x9006: [0x1f, 0x0]
        0x9008: [0x1f, 0x0]
        0x900a: [0x13, 0x0]
        0x900c: [0x2, 0x0]
        0x900e: [0x1f, 0x0]
  wrap:
    setup:
      memory:
        0x9000: [0xff, 0xff]
        0x9002: [0x0, 0x0]
        0x9004: [0x11, 0x0]
        0x9006: [0xff, 0xff]
        0x9008: [0x3, 0x0]
        0x900a: [0x1, 0x0]
        0x900c: [0xff, 0xff]
        0x900e: [0x21, 0x0]
    expect:
      memory:
        0x9000: [0x0, 0x0]
        0x9002: [0xff, 0xff]
        0x9004: [0x2a, 0x0]
        0x9006: [0xff, 0xff]
        0x9008: [0xff, 0xff]
        0x900a: [0xff, 0xff]
        0x900c: [0x1, 0x0]
        0x900e: [0xff, 0xff]
  zero_and_max:
    setup:
      memory:
        0x9000: [0x0, 0x0]
        0x9002: [0xff, 0xff]
        0x9004: [0x0, 0x0]
        0x9006: [0x0, 0x0]
        0x9008: [0x0, 0x0]
        0x900a: [0x0, 0x0]
        0x900c: [0xff, 0xff]
        0x900e: [0x0, 0x0]
    expect:
      memory:
        0x9000: [0x1, 0x0]
        0x9002: [0xfe, 0xff]
        0x9004: [0x2a, 0x0]
        0x9006: [0x0, 0x0]
        0x9008: [0x0, 0x0]
        0x900a: [0xff, 0xff]
        0x900c: [0x0, 0x0]
        0x900e: [0x0, 0x0]
