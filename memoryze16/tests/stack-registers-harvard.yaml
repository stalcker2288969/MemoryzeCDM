version: 1
architecture: cdm16
memory_model: harvard
build:
  sources:
  - ../memory.mlb
  - ../stack.mlb
  - ../pointers.mlb
defaults:
  setup:
    registers:
      r0: 17
      r1: 34
      r2: 51
      r3: 68
      r4: 85
      r5: 102
      r6: 119
      r7: 136
      sp: 61440
    memory:
      0x8ffe: [0x53, 0x0]
      0x9014: [0xa7, 0x0]
  run:
    until: halt
    max_steps: 5000
  preserve_registers:
  - sp
  allowed_register_changes:
  - r0
  - r1
  - r2
  - r3
  - r4
  - r5
  - r6
  - r7
  preserve_memory:
  - address: 0x0
    length: 36864
  - address: 0x9014
    length: 28652
