version: 1
architecture: cdm8
memory_model: harvard
build:
  sources:
  - ../memory.mlb
  - ../stack.mlb
  - ../pointers.mlb
defaults:
  setup:
    registers:
      r0: 17
      r1: 34
      r2: 51
      r3: 68
      sp: 224
    memory:
      0x9f: 83
      0xa4: 167
  run:
    until: halt
    max_steps: 5000
  preserve_registers:
  - sp
  allowed_register_changes:
  - r0
  - r1
  - r2
  - r3
  preserve_memory:
  - address: 0x0
    length: 160
  - address: 0xa4
    length: 60
  - address: 0xe3
    length: 29
cases:
  full_width_literals:
    expect:
      memory:
        0xa0: 255
        0xa1: 255
        0xa2: 128
        0xa3: 0
        0xe0: 255
        0xe1: 255
        0xe2: 128
