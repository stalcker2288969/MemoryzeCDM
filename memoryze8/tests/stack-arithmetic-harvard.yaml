version: 1
architecture: cdm8
memory_model: harvard
build:
  sources:
  - ../memory.mlb
  - ../stack.mlb
  - ../pointers.mlb
defaults:
  setup:
    registers:
      r0: 17
      r1: 34
      r2: 51
      r3: 68
      sp: 224
    memory:
      0x9f: 83
      0xa8: 167
      0xdf: 109
      0xe8: 178
  run:
    until: halt
    max_steps: 5000
  preserve_registers:
  - sp
  allowed_register_changes:
  - r0
  - r1
  - r2
  - r3
  preserve_memory:
  - address: 0x0
    length: 224
  - address: 0xe8
    length: 24
