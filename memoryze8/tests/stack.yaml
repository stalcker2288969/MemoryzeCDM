version: 1
architecture: cdm8
memory_model: unified
build:
  sources:
  - ../memory.mlb
  - ../stack.mlb
  - ../pointers.mlb
defaults:
  setup:
    registers:
      r0: 17
      r1: 34
      r2: 51
      r3: 68
      sp: 224
    memory:
      0x9f: 83
      0xa8: 167
      0xdf: 109
      0xe8: 178
  run:
    until: halt
    max_steps: 5000
  preserve_registers:
  - sp
  allowed_register_changes:
  - r0
  - r1
  - r2
  - r3
  preserve_memory:
  - address: 0x0
    length: 160
  - address: 0xa1
    length: 63
  - address: 0xe3
    length: 29
cases:
  ordinary:
    setup:
      memory:
        0xe0: 2
        0xe1: 7
        0xe2: 19
    expect:
      memory:
        0xe0: 19
        0xe1: 43
        0xe2: 41
        0xa0: 43
  max_value:
    setup:
      memory:
        0xe0: 255
        0xe1: 255
        0xe2: 255
    expect:
      memory:
        0xe0: 255
        0xe1: 43
        0xe2: 41
        0xa0: 43
  zero_value:
    setup:
      memory:
        0xe0: 0
        0xe1: 0
        0xe2: 0
    expect:
      memory:
        0xe0: 0
        0xe1: 43
        0xe2: 41
        0xa0: 43
